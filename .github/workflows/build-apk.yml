name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: জিপ ফাইল খোলা
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then echo "রিপোতে কোনো zip ফাইল পাওয়া যায়নি"; exit 1; fi
          echo "জিপ পাওয়া গেছে: $ZIP"
          mkdir -p "$RUNNER_TEMP/proj"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/proj"
          PKG=$(find "$RUNNER_TEMP/proj" -name package.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG" ]; then echo "জিপের ভেতরে package.json নেই"; exit 1; fi
          DIR=$(dirname "$PKG")
          echo "প্রজেক্ট ফোল্ডার: $DIR"
          mkdir -p "$GITHUB_WORKSPACE/app"
          cp -a "$DIR"/. "$GITHUB_WORKSPACE/app/"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: android-actions/setup-android@v3

      - name: npm ইনস্টল
        working-directory: app
        run: npm install

      - name: HTML প্যাচ + Android প্রজেক্ট তৈরি
        working-directory: app
        run: node setup.js

      - name: gradlew এক্সিকিউটেবল
        working-directory: app
        run: chmod +x android/gradlew

      - name: Debug APK বিল্ড
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dujone-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
