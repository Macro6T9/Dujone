name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        run: |
          set -e
          echo "Files in repo:"
          ls -la
          ZIP=$(find . -maxdepth 3 -iname "*.zip" -not -path "./.git/*" | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "ERROR: no .zip file found in the repo. Upload the zip to the repo root."
            exit 1
          fi
          echo "Using zip: $ZIP"
          mkdir -p "$RUNNER_TEMP/proj"
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/proj"
          PKG=$(find "$RUNNER_TEMP/proj" -name package.json -not -path "*/node_modules/*" | head -n 1 || true)
          if [ -z "$PKG" ]; then
            echo "ERROR: package.json not found inside the zip."
            exit 1
          fi
          DIR=$(dirname "$PKG")
          echo "Project folder: $DIR"
          mkdir -p "$GITHUB_WORKSPACE/app"
          cp -a "$DIR"/. "$GITHUB_WORKSPACE/app/"
          ls -la "$GITHUB_WORKSPACE/app"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: npm install
        working-directory: app
        run: npm install

      - name: Patch HTML and create Android project
        working-directory: app
        run: node setup.js

      - name: Make gradlew executable
        working-directory: app
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dujone-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
